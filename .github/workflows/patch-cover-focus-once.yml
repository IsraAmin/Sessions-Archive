name: One-time cover focus UI patch

on:
  push:
    paths:
      - '.github/workflows/patch-cover-focus-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin cover focus UI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:160]!r}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'src/components/AdminEditorDialog.tsx',
              "import { Icon } from './Icon'\n",
              "import { Icon } from './Icon'\nimport { CoverFocusEditor } from './CoverFocusEditor'\n",
          )

          replace(
              'src/components/AdminEditorDialog.tsx',
              "status: String(form.get('status') || 'published') })",
              "status: String(form.get('status') || 'published'), cover_focus_x: Math.min(100, Math.max(0, Number(form.get('cover_focus_x') || 50))), cover_focus_y: Math.min(100, Math.max(0, Number(form.get('cover_focus_y') || 50))) })",
          )

          replace(
              'src/components/AdminEditorDialog.tsx',
              "</div></section><section className=\"editor-section\"><h3>{ar ? 'الموعد والمكان' : 'Schedule and place'}</h3>",
              "</div></section><section className=\"editor-section\"><h3>{ar ? 'موضع الغلاف في الكارد' : 'Card cover focus'}</h3><CoverFocusEditor key={activeTarget.item.id} session={activeTarget.item} language={language} /></section><section className=\"editor-section\"><h3>{ar ? 'الموعد والمكان' : 'Schedule and place'}</h3>",
          )

          replace(
              'src/pages/AdminPage.tsx',
              "success(ar ? 'تم تحديث غلاف السيشن.' : 'Session cover updated.')\n      await load()",
              "success(ar ? 'تم تحديث غلاف السيشن. اختاري الآن الجزء الذي يظهر في الكارد.' : 'Session cover updated. Now choose the area shown on the card.')\n      await load()\n      setEditing({ type: 'session', item: { ...session, cover_path: path } })",
          )

          replace(
              'src/pages/AdminPage.tsx',
              "<label className=\"file-action\">{t('admin.cover')}<input type=\"file\" accept=\"image/*\"",
              "<label className=\"file-action\">{ar ? 'رفع الغلاف' : 'Upload cover'}<input type=\"file\" accept=\"image/*\"",
          )

          Path('.github/workflows/patch-cover-focus-once.yml').unlink()
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "Sessions Archive Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add controllable session cover focus"
          git push
